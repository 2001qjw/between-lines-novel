$('#dialog').onclick=()=>{if(transitionBusy)return;if(finishTyping())return;if(!locked)advance()};const O=(t,fn,to)=>({t,fn,to});const add=(a=0,v=0,n=0,l=0)=>()=>{S.autonomy+=a;S.vulnerability+=v;S.nik+=n;S.lera+=l};const msg=(text,me=false,time='')=>({text,me,time});
script=[
{id:'start',chapter:'Глава 1 · Дом · 07:00',bg:'room',art:'wake',w:'Рассказчик',t:'7:00. Будильник разрывает тишину. На экране телефона — сообщения от Марка. Вы знакомы всего четыре дня.'},
{w:'Героиня',t:'Он опять не спал? Надеюсь, ничего не случилось…',phone:[msg('Ты спишь? Мне не спалось всю ночь. Думал о том, как странно устроена жизнь: встретить родственную душу в приложении… Это один шанс на миллион. ',false,'06:15'),msg('Не люблю утро без тебя. Кажется, я уже зависим от твоих сообщений. Ты же напишешь, как только откроешь глаза?',false,'06:42'),msg('Ты онлайн уже две минуты и молчишь… Я что-то не то сказал?',false,'06:58')],options:[O('«Доброе утро! Прости, что сразу не ответила»',add(0,1)),O('«Доброе утро. Я только проснулась, напишу после сборов»',add(1)),O('«Мне неприятно, когда ты отслеживаешь мой онлайн»',add(2))]},
{bg:'bath',art:null,spr:[['hero1','center']],w:'Рассказчик',t:'В ванной всё привычно: зеркало, расчёска, зубная щётка и любимый блеск.'},
{w:'Героиня',t:'Я чищу зубы, расчёсываю волосы и наношу любимый блеск. В зеркале мелькает моё отражение — и вспоминаются слова Марка.'},
{art:'ready',spr:[],w:'Воспоминание · голос Марка',t:'«Современные девушки прячут себя за тонной косметики… Пожалуйста, не красься ярко, не будь как все эти пустые куклы».'},
{w:'Героиня',t:'В отражении я вижу себя. Как поступить с блеском?',options:[O('Стереть блеск — «Он прав, естественность лучше»',add(0,1)),O('Оставить как обычно — «Мне нравится мой блеск»',add(1)),O('Добавить яркости — «Я решаю сама»',add(2))]},
{bg:'kitchen',art:null,spr:[['mom_довольная','right'],['hero7','left']],w:'Мама',t:'Доброе утро! Ты сегодня такая задумчивая. Что-то случилось?'},
{w:'Героиня',t:'Я познакомилась с парнем. Его зовут Марк. Он очень внимательный.'},
{spr:[['mom_задумчивая','right'],['hero2','left']],w:'Мама',t:'Здорово, что тебе интересно общаться. А вы уже встречались?'},
{w:'Героиня',t:'Сегодня после школы собираемся в парк.',options:[O('Рассказать маме точное место встречи',()=>{S.flags.mom=true;S.autonomy++}),O('Сказать только, что встречаемся в парке',()=>{S.flags.mom=false}),O('Скрыть подробности — «Не волнуйся»',add(0,1))]},
{spr:[['mom_обеспокоенная','right'],['hero0','left']],w:'Мама',t:'Будь внимательна к своим ощущениям. Ты никому ничего не обязана, даже если человек говорит красивые слова. И лучше встречаться в людном месте.'},
{bg:'room',spr:[['hero6','center']],w:'Героиня',t:'Сумка собрана: тетради, учебники и всё необходимое на месте. Пора выходить в школу.'},
{id:'school',chapter:'Глава 2 · Школа · 07:40',bg:'school',spr:[],w:'Рассказчик',t:'У школьного входа уже шумно. Кто-то спорит о контрольной, кто-то смеётся. Впереди — длинный день.'},
{bg:'hall',spr:[['lera_нейтральная','right'],['hero0','left']],w:'Лера',t:'Ого, ты какая-то бледная. Опять до трёх ночи переписывалась с этим своим Марком?'},
{w:'Героиня',t:'Что ответить Лере?',options:[O('«Он за четыре дня узнал обо мне больше всех!»',add(0,1,0,-1)),O('«Он внимательный, но иногда обижается, если я не отвечаю»',add(1,0,0,1)),O('«Он уже зовёт меня своей девочкой. Это нормально?»',add(2,0,0,2))]},
{spr:[['lera_задумчивая','right'],['hero1','left']],w:'Лера',t:'Четыре дня — это ещё не неделя. А почему вы не виделись? И ты уверена, что встреча будет в людном месте?'},
{w:'Героиня',t:'Марк предложил парк после уроков.',options:[O('«Он старше и занят проектами. Сегодня увидимся»',add(0,1)),O('«Он хотел встретиться без чужих глаз…»',add(0,0,0,1)),O('«Я настояла на людном месте»',add(2,0,0,1))]},
{spr:[['lera_довольная','right'],['hero4','left']],w:'Лера',t:'Слушай, если что-то пойдёт не так — звони. Даже если просто захочешь уйти. Я рядом.'},
{bg:'hall',spr:[['hero2','center']],w:'Героиня · мысли',t:'Лера уходит к кабинету, а я ещё несколько секунд стою у окна. Слова «четыре дня» звучат в голове неожиданно громко.'},
{spr:[['hero3','center']],w:'Героиня · мысли',t:'С Марком правда легко говорить о музыке и фильмах. Но почему перед каждым ответом я теперь думаю, не обидится ли он? Может, дело не в том, как быстро я печатаю.'},
{spr:[['hero1','center']],w:'Героиня · мысли',t:'Звенит первый звонок. Я прячу телефон в карман и решаю хотя бы на уроке сосредоточиться на себе.'},
{bg:'hall',spr:[['nik_радостный','right'],['hero4','left']],w:'Никита',t:'О, привет! Ты уже готова к литературе? Я распечатал список тем, могу скинуть.'},
{w:'Героиня',t:'Никита — наш староста. Всегда выручает с уроками.',options:[O('«Спасибо, ты меня спас!»',add(0,0,2)),O('«Скинь, пожалуйста, потом посмотрю»',add(0,0,1)),O('«Не сейчас, я занята»',add(0,0,-1))]},
{spr:[['nik_смущенный','right'],['hero2','left']],w:'Никита',t:'Кстати, после уроков мы с ребятами идём за чаем. Хочешь с нами?'},
{w:'Героиня',t:'Я обещала встретиться с Марком…',options:[O('«Спасибо! Может, зайду ненадолго»',()=>{S.nik+=2;S.flags.tea=true}),O('«У меня встреча, но спасибо за приглашение»',()=>{S.nik++;S.flags.tea=false}),O('«Не могу, и не спрашивай»',()=>{S.nik--;S.flags.tea=false})]},
{when:()=>S.flags.tea, spr:[['nik_радостный','right'],['hero7','left']],w:'Никита',t:'Тогда напиши, если решишь присоединиться. И не переживай из-за контрольной, вместе разберёмся.'},
{bg:'class',spr:[['teacher_нейтральная','center']],w:'Учительница',t:'Открываем тетради. Телефоны убрали. Сегодня проверочная по литературе.'},
{spr:[['teacher_нейтральная','center']],w:'Учительница',t:'Прежде чем начнём, вспомните: как в литературе отличить заботу героя от желания управлять другим человеком? Ищите подтверждения в поступках, а не только в красивых словах.'},
{spr:[['hero2','left'],['teacher_нейтральная','right']],w:'Героиня · мысли',t:'Странно. Вчера я бы сразу сказала, что забота — это когда о тебе постоянно думают. А теперь хочется добавить: когда ещё и слышат тебя.'},
{spr:[['teacher_нейтральная','center']],w:'Учительница',t:'У вас двадцать минут. Если ответ кажется очевидным, перечитайте вопрос: иногда важна именно причина поступка.'},
{bg:'classClose',spr:[['hero3','left']],w:'Рассказчик',t:'Под тетрадью вспыхивает экран. Марк уже освободился и ждёт ответа.'},
{w:'Телефон',t:'Марк пишет прямо во время контрольной.',autoNextPhone:true,phone:[msg('Я уже освободился раньше. Жду тебя около школы. Ты почему не отвечаешь сразу? Я же вижу, что ты была в сети пять минут назад.'),msg('У нас контрольный тест по литературе, учительница ходит по рядам.',true),msg('Тест важнее меня? Я бросил дела, стою на холоде ради тебя. Видел, как ты смеялась с парнем в сером худи. Кто это?')],options:[O('«Это Никита, староста! Он только помогал с уроками, честно!»',add(0,2)),O('«Мы одноклассники. Мне пора убрать телефон»',add(1)),O('«Ты следил за мной? Мне не нравится этот допрос»',add(2))]},
{w:'Телефон',t:'Я быстро сделала фотографию прямо за партой, но пока не отправила её. Марк снова пишет. Отправить ли ему фото?',phone:[msg('Я не злюсь. Просто думал, ты особенная. Скинь фото из класса прямо сейчас — хочу видеть, что ты сидишь одна. Если нечего скрывать, конечно.')],options:[O('Отправить селфи из класса',()=>{S.vulnerability+=2;S.flags.photo=true}),O('«Убираю телефон до звонка. Увидимся в парке»',()=>{S.autonomy+=2;S.flags.photo=false}),O('Не отвечать и убрать телефон',()=>{S.autonomy++;S.flags.photo=false})]},
{when:()=>S.flags.photo,art:'selfie',spr:[],w:'Героиня · мысли',t:'Фотография отправлена. Но почему мне приходится доказывать, где я нахожусь?'},
{when:()=>S.flags.photo,art:null,spr:[['hero5','left']],w:'Героиня · мысли',t:'Телефон снова вибрирует. Я убираю его под тетрадь.'},
{spr:[['teacher_недовольная','right'],['hero5','left']],w:'Учительница',t:'У нас контрольная. Телефон убери, пожалуйста. Если нужна помощь по заданию — подними руку.'},
{spr:[['teacher_недовольная','right'],['hero5','left']],w:'Учительница',t:'Я понимаю, что сообщения бывают срочными. Но если кто-то требует ответа прямо посреди контрольной, это не повод лишать себя права спокойно учиться.'},
{spr:[['teacher_нейтральная','right'],['hero2','left']],w:'Героиня',t:'Извините. Я правда отвлеклась. Можно я допишу последнюю строчку?'},
{spr:[['teacher_нейтральная','center']],w:'Учительница',t:'Конечно. И если после урока захочешь поговорить — я здесь.'},
{bg:'hallNight',spr:[['nik_серьезный','right'],['hero3','left']],w:'Никита',t:'Ты сегодня совсем не в себе. Всё нормально? Если кто-то тебя достаёт сообщениями, не обязательно отвечать немедленно.'},
{w:'Героиня',t:'Сказать Никите про Марка?',options:[O('«Он требует отчётов и ревнует к тебе. Мне тревожно»',()=>{S.nik+=3;S.autonomy++;S.flags.nikKnows=true}),O('«Немного сложно, но я справлюсь»',()=>{S.nik++;S.flags.nikKnows=false}),O('«Не лезь, пожалуйста»',()=>{S.nik--;S.flags.nikKnows=false})]},
{when:()=>S.flags.nikKnows,spr:[['nik_задумчивый','right'],['hero2','left']],w:'Никита',t:'Это звучит неприятно. Я не буду решать за тебя. Но если захочешь поговорить или чтобы кто-то был рядом, просто скажи.'},
{when:()=>!S.flags.nikKnows,spr:[['nik_нейтральный','right'],['hero1','left']],w:'Никита',t:'Ладно. Просто знай: если нужна помощь, можешь обратиться. Увидимся завтра.'},
{art:'door',spr:[],w:'Рассказчик',t:'У выхода ты останавливаешься. Встреча уже скоро. На секунду задерживаешься, прислушиваясь к шуму школьного двора.'},
{art:'door',spr:[],w:'Героиня · мысли',t:'Можно просто пойти дальше. А можно сообщить кому-то, куда я направляюсь. Времени достаточно, чтобы принять решение.'},
{art:'door',spr:[],w:'Героиня',t:'Что сделать перед встречей?',options:[O('Написать маме, где я буду',()=>{S.flags.mom=true;S.autonomy++}),O('Отправить Лере геолокацию и попросить быть на связи',()=>{S.flags.support=true;S.lera+=2;S.autonomy++}),O('Пойти без дополнительных сообщений',add(0,1))]},
{id:'park',chapter:'Глава 3 · Парк · 17:00',bg:'park',spr:[['mark_нейтральный','right'],['hero1','left']],w:'Рассказчик',t:'В парке загораются фонари. Марк ждёт у скамейки. Вживую он кажется более напряжённым, чем на фотографиях.'},
{art:'meet',spr:[],w:'Марк',t:'Наконец-то! Ты опоздала на целых четыре минуты. Я уже подумал, что твой Никита тебя задержал. Шучу, расслабься.'},
{art:null,spr:[['mark_довольный','right'],['hero3','left']],w:'Героиня',t:'Объятие кажется слишком крепким.',options:[O('«Прости, учительница долго собирала тетради»',add(0,1)),O('«Шутка не очень смешная. Четыре минуты — пустяк»',add(1)),O('«Отпусти, пожалуйста. Мне неприятно»',add(2))]},
{spr:[['mark_нейтральный','right'],['hero0','left']],w:'Марк',t:'Я просто переживаю. И, кстати, твоя Лера… Видел её сторис. Такие подруги только тянут вниз. Не обсуждай с ней нас, ладно?'},
{w:'Героиня',t:'Как ответить?',options:[O('«Хорошо, не буду ей рассказывать»',()=>{add(0,2,0,-2)();S.flags.leraAnswer='agree'}),O('«Она моя подруга много лет. Не говори о ней так»',()=>{add(2,0,0,1)();S.flags.leraAnswer='defend'}),O('«Ты не можешь решать, с кем мне дружить»',()=>{add(3,0,0,1)();S.flags.leraAnswer='boundary'})]},
{when:()=>S.flags.leraAnswer==='agree',spr:[['mark_довольный','right'],['hero5','left']],w:'Марк',t:'Вот и хорошо, что мы понимаем друг друга. Мне просто важно, чтобы никто не вмешивался в наши отношения.'},
{when:()=>S.flags.leraAnswer==='defend',spr:[['mark_наигранно грустный','right'],['hero5','left']],w:'Марк',t:'Ты её защищаешь? А я-то думал, ты понимаешь, что я просто переживаю за тебя. Почему моё мнение для тебя ничего не значит?'},
{when:()=>S.flags.leraAnswer==='boundary',spr:[['mark_злой','right'],['hero3','left']],w:'Марк',t:'Значит, мою заботу ты называешь контролем? Я пытаюсь уберечь тебя от ошибок, а ты выставляешь меня злодеем.'},
{when:()=>S.flags.nikKnows,spr:[['hero4','left'],['mark_злой','right']],w:'Героиня · мысли',t:'Вспоминаются слова Никиты: «Я не буду решать за тебя». Почему Марк говорит совсем иначе?'},
{when:()=>S.flags.support===true||S.flags.mom===true,spr:[['hero2','left'],['mark_злой','right']],w:'Рассказчик',t:'Ты вспоминаешь, что предупредила близкого человека о встрече. От этой мысли становится немного спокойнее.'},
{when:()=>!S.flags.support&&!S.flags.mom,spr:[['hero2','left'],['mark_злой','right']],w:'Героиня · мысли',t:'Я никому не сообщила, где нахожусь. В следующий раз стоит заранее продумать, кому можно написать, если станет некомфортно.'},
{spr:[['mark_злой','right'],['hero3','left']],w:'Марк',t:'Докажи, что ты честна. Дай телефон. Я сам заблокирую Никиту. Если тебе нечего скрывать, в чём проблема?'},
{w:'Героиня',t:'Марк протягивает руку к телефону. Что делать?',options:[O('Отдать телефон, чтобы он не обижался',()=>{S.vulnerability+=3;S.flags.phoneGiven=true}),O('Спрятать телефон и попытаться сменить тему',()=>{S.autonomy++;S.flags.phoneGiven=false}),O('Отойти и сказать: «Нет. Это моё личное пространство»',()=>{S.autonomy+=3;S.flags.phoneGiven=false})]},
{when:()=>S.flags.phoneGiven,spr:[['mark_довольный','right'],['hero5','left']],w:'Марк',t:'Вот видишь, ничего страшного. Я просто хочу быть уверен в нас. Зачем ты так переживала?'},
{when:()=>!S.flags.phoneGiven,spr:[['mark_очень злой','right'],['hero3','left']],w:'Марк',t:'Не ожидал такого. Я же просто просил доверия!'},
{w:'Героиня',t:'Как завершить встречу?',options:[O('Остаться и попытаться его успокоить',()=>{S.vulnerability+=2;S.flags.parkExit='stay'}),O('Сказать, что пора домой, и уйти',()=>{S.autonomy+=2;S.flags.parkExit='leave'}),O('Позвонить близкому человеку и уйти',()=>{S.autonomy+=3;S.flags.parkExit='call';S.flags.called=true})]},
{when:()=>S.flags.parkExit==='stay',spr:[['mark_наигранно грустный','right'],['hero5','left']],w:'Героиня',t:'Я остаюсь на скамейке. «Давай просто спокойно поговорим», — предлагаю я, хотя в груди всё ещё неприятно сжимается.'},
{when:()=>S.flags.parkExit==='stay',spr:[['mark_нейтральный','right'],['hero3','left']],w:'Марк',t:'Вот теперь ты меня слышишь. Я ведь не прошу многого — просто хочу быть для тебя самым важным.'},
{when:()=>S.flags.parkExit==='stay',spr:[['hero2','left'],['mark_довольный','right']],w:'Героиня · мысли',t:'Мы сидим ещё почти час. Марк рассказывает о своих планах, иногда даже шутит. Но разговор снова и снова возвращается к тому, с кем мне можно общаться.'},
{when:()=>S.flags.parkExit==='stay',spr:[['hero3','left'],['mark_нейтральный','right']],w:'Рассказчик',t:'Когда в парке становится темно, я говорю, что мне действительно пора. Марк неохотно прощается. Я ухожу только теперь — встреча длилась гораздо дольше, чем я собиралась.'},
{when:()=>S.flags.parkExit==='leave',spr:[['hero4','left'],['mark_злой','right']],w:'Героиня',t:'«Мне пора домой. Я не хочу продолжать этот разговор», — говорю я и отступаю на шаг.'},
{when:()=>S.flags.parkExit==='leave',spr:[['mark_наигранно грустный','right'],['hero4','left']],w:'Марк',t:'Серьёзно? Ты просто уйдёшь посреди разговора? Ладно. Я запомню.'},
{when:()=>S.flags.parkExit==='leave',spr:[['hero2','center']],w:'Героиня · мысли',t:'Я выхожу на освещённую дорожку. Сердце стучит, но решение уйти было моим. Мне нужно время, чтобы всё обдумать.'},
{when:()=>S.flags.parkExit==='call',spr:[['hero4','left'],['mark_злой','right']],w:'Героиня',t:'Я отхожу к дорожке и набираю номер. «Я заканчиваю встречу. Мне нужно поговорить с близким человеком».'},
{when:()=>S.flags.parkExit==='call',spr:[['hero2','center']],w:'Рассказчик',t:'Марк остаётся у скамейки, а я направляюсь к выходу из парка, не прерывая звонка.'},
{when:()=>S.flags.called&&S.nik>=3,spr:[['hero4','left']],w:'Никита · по телефону',t:'Ты в порядке? Если хочешь, я побуду на связи, пока ты добираешься домой. Не нужно ничего объяснять.'},

function ending(){clearInterval(typingTimer);$('#phoneWrap').style.display='none';$('#dialog').style.display='none';locked=true;art(null);sprites([]);let score=S.autonomy-S.vulnerability;let type=S.flags.last==='block'?'green':S.flags.last==='call'?'red':'yellow';let data={green:['Зелёный финал · Границы','Ты блокируешь Марка и созваниваешься с Лерой. Рядом есть люди, которым можно доверять. Ты выбираешь отношения, в которых уважают твои решения.'],yellow:['Жёлтый финал · Сомнения','Ты пока не звонишь, но продолжаешь возвращаться мыслями к разговору. Тебе нужно время, чтобы разобраться в чувствах. Поддержка друзей и близких остаётся доступной.'],red:['Красный финал · Подавление','Ты звонишь Марку, чтобы помириться, хотя разговор оставил неприятное чувство. Постепенно ты всё чаще отказываешься от своих планов ради его одобрения. Но ситуацию можно изменить, обратившись за поддержкой.']}[type];showOverlay(`<h2>${data[0]}</h2><p>${data[1]}</p><p>Автономия: ${S.autonomy} · Уступки давлению: ${S.vulnerability} · Доверие Никиты: ${S.nik}</p><button id="analyze">Разбор истории →</button>`);$('#analyze').onclick=analysis}
function analysis(){showOverlay('<h2>Что происходило в истории?</h2><p style="font-size:17px">Нажимай на карточки, чтобы раскрыть пояснения.</p><div id="cards"></div><button id="again">Пройти ещё раз</button>');let cards=[['Love bombing','Слишком быстрые признания и обещания исключительной близости могут создавать давление ещё до того, как люди хорошо узнали друг друга.'],['Забота или контроль?','Требования отвечать немедленно, присылать фотоотчёты и объяснять общение с одноклассниками нарушают личные границы.'],['Изоляция','Попытки очернить друзей и запретить обсуждать отношения могут лишать человека поддержки.'],['Вина и подмена ответственности','Когда спокойный отказ называют жестокостью, внимание смещается с самого нарушения границ на чувство вины.']];cards.forEach(([title,body])=>{let b=document.createElement('button');b.textContent=title+'  +';b.onclick=()=>b.textContent=title+'\n\n'+body;$('#cards').append(b)});$('#again').onclick=()=>location.reload()}

function save(){localStorage.setItem('betweenLinesV10',JSON.stringify({state:S}));alert('Прогресс сохранён')}function load(){let v=localStorage.getItem('betweenLinesV10');if(!v){alert('Сохранений пока нет');return}Object.assign(S,JSON.parse(v).state);$('#menu').style.display='none';$('#overlay').style.display='none';$('#phoneWrap').style.display='none';$('#choices').style.display='none';locked=false;transitionBusy=false;lastChapter='';$('#sceneCurtain').classList.remove('visible');run()}
$('#save').onclick=save;$('#load').onclick=load;$('#home').onclick=()=>{$('#menu').style.display='flex';$('#choices').style.display='none';$('#phoneWrap').style.display='none'};$('#start').onclick=()=>{$('#menu').style.display='none';Object.assign(S,{autonomy:0,vulnerability:0,nik:0,lera:0,items:[],flags:{},pos:0,chatHistory:[],chatSeen:{},phonePending:null});transitionBusy=false;lastChapter='';$('#sceneCurtain').classList.remove('visible');run()};$('#continue').onclick=load;
